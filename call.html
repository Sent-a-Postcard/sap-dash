<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>SAP · Call List</title>
<style>
  :root{
    --bg:#F7F4F1; --card:#FFFFFF; --line:#E7DFD8; --line2:#D6C9BE;
    --ink:#241B18; --mute:#8A7B72; --maroon:#4A161F; --gold:#A8801F;
    --green:#1B8A57; --greenbg:#E7F5EE; --risk:#FFF3EA; --riskline:#F0C49B; --riskink:#B4500F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:36px}
  header{position:sticky;top:0;z-index:20;background:var(--card);
    padding:14px 16px 0;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .brand h1{margin:0;font-size:17px;font-weight:700;color:var(--maroon)}
  .brand span{font-size:12px;color:var(--mute)}
  .score{display:flex;gap:8px;margin-bottom:12px}
  .pill{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .pill b{display:block;font-size:19px;line-height:1.1}
  .pill small{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
  .pill.earn b{color:var(--gold)}
  nav{display:flex;gap:6px}
  nav button{flex:1;background:none;border:none;color:var(--mute);font:600 14px inherit;
    padding:11px 4px;border-bottom:2.5px solid transparent;cursor:pointer}
  nav button.on{color:var(--maroon);border-bottom-color:var(--maroon)}
  nav button .n{display:inline-block;min-width:20px;padding:1px 6px;margin-left:5px;border-radius:9px;
    background:var(--line);font-size:11.5px;color:var(--ink)}
  nav button.on .n{background:var(--maroon);color:#fff}
  .dates{display:flex;gap:6px;align-items:center;padding:10px 0 12px}
  .dates button{padding:7px 13px;border-radius:16px;border:1px solid var(--line);
    background:var(--bg);color:var(--mute);font:600 12.5px inherit;cursor:pointer;white-space:nowrap}
  .dates button.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
  .dates input{flex:1;min-width:0;padding:7px 10px;border-radius:16px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font:600 12.5px inherit}
  main{padding:14px 14px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(36,27,24,.04);
    transition:opacity .25s,transform .25s}
  .card.gone{opacity:0;transform:scale(.96)}
  .tapzone{cursor:pointer}
  .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .who{font-size:17px;font-weight:700}
  .meta{font-size:12.5px;color:var(--mute);margin-top:2px}
  .amt{font-size:16px;font-weight:700;color:var(--maroon);white-space:nowrap}
  .items{margin:10px 0 0;font-size:13.5px;color:var(--ink)}
  .why{margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--risk);
    border:1px solid var(--riskline);font-size:12.5px;color:var(--riskink)}
  .addr{margin-top:9px;padding:9px 10px;border-radius:10px;background:var(--bg);
    border:1px solid var(--line);font-size:12.5px;color:#4A403A;line-height:1.5}
  .addr.risk{background:var(--risk);border-color:var(--riskline);color:var(--riskink)}
  .addr .lbl{display:block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;
    color:var(--mute);margin-bottom:3px;font-weight:700}
  .addr.risk .lbl{color:var(--riskink)}
  .acts{display:flex;gap:8px;margin-top:12px}
  .acts a{flex:1;text-decoration:none;text-align:center;padding:13px 8px;border-radius:12px;
    font-weight:700;font-size:15px}
  .call{background:var(--green);color:#fff}
  .wa{background:var(--greenbg);color:#166B45;border:1px solid #BFE3D1}
  .out{display:flex;gap:7px;margin-top:9px}
  .out button{flex:1;padding:10px 4px;border-radius:11px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font:600 13px inherit;cursor:pointer}
  .out button:active{transform:scale(.97)}
  .out .good{border-color:#9FD9BC;color:#146B43;background:var(--greenbg)}
  .out .warn{border-color:#EBD6A0;color:#8A6512;background:#FDF7E7}
  .out .bad{border-color:#EFC0C0;color:#A33636;background:#FDF0F0}
  .empty{text-align:center;padding:48px 20px;color:var(--mute)}
  .empty .big{font-size:40px;margin-bottom:10px}
  .gate{padding:60px 24px;text-align:center}
  .gate input{width:100%;max-width:320px;padding:13px;border-radius:12px;border:1px solid var(--line2);
    background:var(--card);color:var(--ink);font-size:16px;text-align:center;margin:14px 0}
  .gate button{padding:13px 30px;border-radius:12px;border:none;background:var(--maroon);
    color:#fff;font:700 15px inherit;cursor:pointer}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:70;
    background:var(--maroon);color:#fff;padding:11px 20px;border-radius:22px;font-weight:700;
    font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .toast.show{opacity:1}
  .foot{text-align:center;color:var(--mute);font-size:11.5px;padding:22px 16px}
  .sheet{position:fixed;inset:0;z-index:60;background:rgba(36,27,24,.45);display:none}
  .sheet.on{display:block}
  .sheetin{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;
    background:var(--bg);border-radius:18px 18px 0 0}
  .sh{position:sticky;top:0;background:var(--card);padding:14px 16px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center}
  .sh b{font-size:16px;color:var(--maroon)}
  .sh button{background:none;border:none;color:var(--mute);font-size:26px;cursor:pointer;line-height:1}
  .sb{padding:14px 16px 30px}
  .sec{margin-bottom:14px}
  .sec h4{margin:0 0 7px;font-size:10.5px;color:var(--mute);text-transform:uppercase;
    letter-spacing:.6px;font-weight:700}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:13.5px}
  .kv span:first-child{color:var(--mute)}
  .kv span:last-child{text-align:right;font-weight:600}
  .li{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;
    border-bottom:1px solid var(--line)}
  .li:last-child{border:none}
  .scan{font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;
    justify-content:space-between;gap:10px}
  .scan:last-child{border:none}
  .scan span:last-child{color:var(--mute);white-space:nowrap;font-size:11.5px}
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <div style="font-size:34px">🔑</div>
  <h2 style="font-size:17px;margin:10px 0 0">Sent a Postcard — Call List</h2>
  <p style="color:var(--mute);font-size:13.5px">Enter your access code (once per phone)</p>
  <input id="k" placeholder="access code" autocomplete="off">
  <br><button onclick="saveKey()">Open</button>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><h1>Call List</h1><span id="stamp">—</span></div>
    <div class="score">
      <div class="pill"><b id="sConf">0</b><small>Confirmed</small></div>
      <div class="pill"><b id="sSave">0</b><small>Saved</small></div>
      <div class="pill earn"><b id="sEarn">₹0</b><small>Bonus today</small></div>
    </div>
    <nav>
      <button id="tabC" class="on" onclick="show('confirm')">Confirm <span class="n" id="nC">0</span></button>
      <button id="tabR" onclick="show('rescue')">Rescue <span class="n" id="nR">0</span></button>
    </nav>
    <div class="dates" id="dates">
      <button id="dToday" class="on" onclick="pickDay(0)">Today</button>
      <button id="dYest" onclick="pickDay(1)">Yesterday</button>
      <input type="date" id="dPick" onchange="pickDate(this.value)">
    </div>
  </header>
  <main id="list"></main>
  <div class="foot">Tap a name for full order details · customer info is confidential</div>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheetin">
    <div class="sh"><b id="shTitle">—</b><button onclick="closeSheet()">×</button></div>
    <div class="sb" id="shBody">Loading…</div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const API="https://evxogfucxkhjmflxtshl.supabase.co/functions/v1/call-list";
const ORD="https://evxogfucxkhjmflxtshl.supabase.co/functions/v1/orders-api";
let KEY=localStorage.getItem("sapCallerKey")||"", DATA={confirm:[],rescue:[]}, TAB="confirm", DAY=null;
const istDate=off=>new Date(Date.now()+5.5*3600e3-(off||0)*864e5).toISOString().slice(0,10);

function saveKey(){const v=document.getElementById("k").value.trim();if(!v)return;
  localStorage.setItem("sapCallerKey",v);KEY=v;boot();}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),1900);}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tel=p=>String(p||"").replace(/[^0-9+]/g,"");
const wa=p=>{let d=tel(p).replace(/^\+/,"");if(d.length===10)d="91"+d;return d;};
function fresh(iso){if(!iso)return"";const h=Math.round((Date.now()-new Date(iso))/36e5);
  return h<1?"just now":h<24?h+"h ago":Math.round(h/24)+"d ago";}

const FLAG_TXT={no_house_number:"No house/building number",too_short:"Address too short",
  junk_text:"Address looks unclear",bad_pincode:"Pincode looks wrong"};
function addrBlock(o){
  const f=o.addr_flags||[], risky=f.length>0;
  const why=risky?" — "+f.map(x=>FLAG_TXT[x]||x).join(", "):"";
  return `<div class="addr ${risky?"risk":""}">
    <span class="lbl">${risky?"⚠️ Check this address"+esc(why):"Delivery address"}</span>
    ${esc(o.address||"—")}${o.pincode?", "+esc(o.pincode):""}</div>`;
}

function cardConfirm(o){
  const risky=(o.addr_flags||[]).length>0;
  const msg=encodeURIComponent(risky
    ? `Sat sri akal ${o.name} ji, Sent a Postcard ton. Tuhada order ${o.order_number} (${o.items.join(", ")}, Rs ${o.amount} COD) confirm karna si. Saade kol eh address hai:\n\n${o.address}, ${o.pincode}\n\nGhar da number te koi landmark v bhej dena 🙏`
    : `Sat sri akal ${o.name} ji, Sent a Postcard ton. Tuhada order ${o.order_number} confirm karna si - ${o.items.join(", ")}, Rs ${o.amount} cash on delivery. Ki assi bhej deiye?`);
  return `<div class="card" id="c-${esc(o.order_number)}"${o.done?' style="opacity:.55"':''}>
    <div class="tapzone" onclick="openOrder('${esc(o.order_number)}')">
      <div class="top"><div><div class="who">${esc(o.name)}${o.done?' <span style="font-size:11px;color:var(--green)">✓ called</span>':''}</div>
        <div class="meta">${esc(o.order_number)} · ${esc(o.city)} · ${fresh(o.placed)}</div></div>
        <div class="amt">₹${o.amount}</div></div>
      <div class="items">📦 ${esc(o.items.join(", "))||"—"}</div>
      ${addrBlock(o)}
    </div>
    <div class="acts">
      <a class="call" href="tel:${tel(o.phone)}">📞 Call</a>
      <a class="wa" href="https://wa.me/${wa(o.phone)}?text=${msg}" target="_blank" rel="noopener">WhatsApp</a>
    </div>
    <div class="out">
      <button class="good" onclick="log('${esc(o.order_number)}','confirm','confirmed',this)">✓ Confirmed</button>
      <button class="warn" onclick="log('${esc(o.order_number)}','confirm','no_answer',this)">No answer</button>
      <button class="bad"  onclick="log('${esc(o.order_number)}','confirm','cancelled',this)">Cancel</button>
    </div></div>`;
}
function cardRescue(o){
  const msg=encodeURIComponent(`Sat sri akal ${o.name} ji, Sent a Postcard ton. Tuhada parcel ${o.order_number} delivery layi aaya si par courier tuhanu mil nahi saka. Ki assi kal dubara bhej deiye? "HAAN" likh dena.`);
  return `<div class="card" id="c-${esc(o.order_number)}">
    <div class="tapzone" onclick="openOrder('${esc(o.order_number)}')">
      <div class="top"><div><div class="who">${esc(o.name)}</div>
        <div class="meta">${esc(o.order_number)} · ${esc(o.city)} · flagged ${fresh(o.flagged)}</div></div>
        <div class="amt">₹${o.amount}</div></div>
      <div class="why">⚠️ <b>${esc(o.reason||"Delivery failed")}</b></div>
    </div>
    <div class="acts">
      <a class="call" href="tel:${tel(o.phone)}">📞 Call now</a>
      <a class="wa" href="https://wa.me/${wa(o.phone)}?text=${msg}" target="_blank" rel="noopener">WhatsApp</a>
    </div>
    <div class="out">
      <button class="good" onclick="log('${esc(o.order_number)}','rescue','saved',this)">✓ Saved</button>
      <button class="warn" onclick="log('${esc(o.order_number)}','rescue','no_answer',this)">No answer</button>
      <button class="bad"  onclick="log('${esc(o.order_number)}','rescue','refused',this)">Refused</button>
    </div></div>`;
}

async function openOrder(num){
  const s=document.getElementById("sheet"); s.classList.add("on");
  document.getElementById("shTitle").textContent=num;
  document.getElementById("shBody").innerHTML="Loading…";
  try{
    const r=await fetch(`${ORD}?key=${encodeURIComponent(KEY)}&order=${encodeURIComponent(num.replace("#",""))}`);
    const d=await r.json();
    if(d.error){document.getElementById("shBody").textContent=d.error;return;}
    const o=d.order;
    const items=(o.items||[]).map(i=>`<div class="li"><span>${esc(i.skus?.name||"item")}${i.qty>1?" ×"+i.qty:""}</span><span>₹${Math.round(i.price)}</span></div>`).join("")||"—";
    const ships=(o.shipments||[]).map(sh=>`<div class="li"><span>${sh.direction==="REVERSE"?"↩︎ Return":"→ Forward"} · ${esc(sh.awb)}</span><span>${esc(sh.current_status||"")}</span></div>`).join("")||'<div style="color:var(--mute);font-size:13px">Not shipped yet</div>';
    const scans=(o.scans||[]).slice(0,10).map(sc=>`<div class="scan"><span>${esc(sc.status_text)}${sc.location?" · "+esc(sc.location):""}</span><span>${new Date(sc.scan_at).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</span></div>`).join("")||'<div style="color:var(--mute);font-size:13px">No scans yet</div>';
    const calls=(o.calls||[]).map(c=>`<div class="scan"><span>${esc(c.task)} — <b>${esc(c.outcome)}</b></span><span>${new Date(c.created_at).toLocaleDateString("en-IN",{day:"2-digit",month:"short"})}</span></div>`).join("");
    document.getElementById("shBody").innerHTML=`
      <div class="acts" style="margin:0 0 14px">
        <a class="call" href="tel:${tel(o.phone)}">📞 Call</a>
        <a class="wa" href="https://wa.me/${wa(o.phone)}" target="_blank" rel="noopener">WhatsApp</a></div>
      <div class="sec"><h4>Customer</h4><div class="box">
        <div class="kv"><span>Name</span><span>${esc(o.customer_name)}</span></div>
        <div class="kv"><span>Phone</span><span>${esc(o.phone)}</span></div>
        <div class="kv"><span>Address</span><span style="max-width:62%">${esc(o.address||"—")}</span></div>
        <div class="kv"><span>City</span><span>${esc(o.city)}, ${esc(o.state)} ${esc(o.pincode||"")}</span></div>
      </div></div>
      <div class="sec"><h4>What they ordered</h4><div class="box">${items}
        <div class="kv" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px">
          <span>Total (${esc(o.payment_mode)})</span><span style="color:var(--maroon);font-size:15px">₹${Math.round(o.total)}</span></div>
        <div class="kv"><span>Placed</span><span>${new Date(o.created_at).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</span></div>
      </div></div>
      <div class="sec"><h4>Parcels</h4><div class="box">${ships}</div></div>
      <div class="sec"><h4>Tracking</h4><div class="box">${scans}</div></div>
      ${calls?`<div class="sec"><h4>Call history</h4><div class="box">${calls}</div></div>`:""}`;
  }catch(e){document.getElementById("shBody").textContent="Could not load — check internet";}
}
function closeSheet(){document.getElementById("sheet").classList.remove("on");}

function pickDay(off){DAY=off===0?null:istDate(off);
  document.getElementById("dPick").value=off===0?"":DAY;markDates();boot();}
function pickDate(v){DAY=v||null;markDates();boot();}
function markDates(){
  document.getElementById("dToday").className=DAY===null?"on":"";
  document.getElementById("dYest").className=DAY===istDate(1)?"on":"";}

function show(t){TAB=t;
  document.getElementById("tabC").className=t==="confirm"?"on":"";
  document.getElementById("tabR").className=t==="rescue"?"on":"";
  document.getElementById("dates").style.display=t==="confirm"?"flex":"none";
  render();}

function render(){
  const rows=DATA[TAB]||[], el=document.getElementById("list");
  document.getElementById("nC").textContent=(DATA.confirm||[]).length;
  document.getElementById("nR").textContent=(DATA.rescue||[]).length;
  if(!rows.length){el.innerHTML=`<div class="empty"><div class="big">🎉</div><div><b>All done here</b></div>
    <div style="font-size:13px;margin-top:6px">${TAB==="confirm"?(DAY?"No COD orders on this date.":"Every COD order is confirmed."):"No failed deliveries to rescue."}</div></div>`;return;}
  el.innerHTML=rows.map(TAB==="confirm"?cardConfirm:cardRescue).join("");
}

async function log(order,task,outcome,btn){
  const card=document.getElementById("c-"+order); btn.disabled=true;
  try{
    await fetch(API+"?key="+encodeURIComponent(KEY),{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({order_number:order,task,outcome})});
    if(card){card.classList.add("gone");setTimeout(()=>card.remove(),260);}
    const k=task==="confirm"?"confirm":"rescue";
    DATA[k]=DATA[k].filter(x=>x.order_number!==order);
    if(outcome==="saved"){bump("sSave");bumpEarn(100);toast("Saved! +₹100 🎉");}
    else if(outcome==="confirmed"){bump("sConf");toast("Confirmed ✓");}
    else toast("Logged");
    document.getElementById("nC").textContent=(DATA.confirm||[]).length;
    document.getElementById("nR").textContent=(DATA.rescue||[]).length;
    if(!(DATA[TAB]||[]).length)render();
  }catch(e){btn.disabled=false;toast("No internet — try again");}
}
function bump(id){const e=document.getElementById(id);e.textContent=(+e.textContent||0)+1;}
function bumpEarn(n){const e=document.getElementById("sEarn");
  e.textContent="₹"+((parseInt(e.textContent.replace(/\D/g,""))||0)+n);}

async function boot(){
  if(!KEY){document.getElementById("gate").hidden=false;document.getElementById("app").hidden=true;return;}
  try{
    const r=await fetch(API+"?key="+encodeURIComponent(KEY)+(DAY?"&date="+DAY:""));
    if(r.status===401){localStorage.removeItem("sapCallerKey");KEY="";
      document.getElementById("gate").hidden=false;document.getElementById("app").hidden=true;
      toast("Wrong code");return;}
    const d=await r.json(); DATA=d;
    document.getElementById("gate").hidden=true;document.getElementById("app").hidden=false;
    document.getElementById("sConf").textContent=d.today.confirmed;
    document.getElementById("sSave").textContent=d.today.saved;
    document.getElementById("sEarn").textContent="₹"+d.today.earned;
    document.getElementById("stamp").textContent=new Date(d.generated_at)
      .toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
    render();
  }catch(e){toast("Could not load — check internet");}
}
boot(); setInterval(()=>{if(!document.getElementById("sheet").classList.contains("on"))boot();},120000);
</script>
</body>
</html>
